<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History of English Literature</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#202124}
header{background:#202124;color:white;padding:28px 20px;text-align:center}
header h1{margin:0 0 8px;font-size:30px}
header p{margin:0;color:#d9d9d9}
.container{max-width:900px;margin:30px auto;padding:0 18px}
.progress{margin-bottom:20px;font-weight:700}
.card{background:white;border-radius:12px;padding:25px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:20px}
.question{font-size:20px;font-weight:700;line-height:1.5;margin-bottom:20px}
.option{display:block;width:100%;text-align:left;padding:14px 16px;margin:10px 0;border:2px solid #ddd;border-radius:9px;background:white;cursor:pointer;font-size:16px}
.option:hover{background:#f1f3f4}
.option.correct{background:#d9ead3;border-color:#5b8c4a}
.option.wrong{background:#f4cccc;border-color:#b94a48}
.option:disabled{cursor:default}
.result{margin-top:18px;padding:16px;border-radius:9px;background:#f1f3f4;line-height:1.6}
.explanation{margin-top:12px}
.controls{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
button.control{padding:12px 18px;border:0;border-radius:8px;background:#202124;color:white;cursor:pointer}
button.control:disabled{opacity:.45;cursor:default}
#score{font-weight:700}
</style>
</head>
<body>
<header>
  <h1>History of English Literature</h1>
  <p id="title">Loading quiz...</p>
</header>
<div class="container">
  <div class="progress" id="progress"></div>
  <div class="card">
    <div class="question" id="question"></div>
    <div id="options"></div>
    <div id="result"></div>
    <div class="controls">
      <button class="control" id="prev">Previous</button>
      <span id="score"></span>
      <button class="control" id="next">Next</button>
    </div>
  </div>
</div>

<script>
let quiz;
let current = 0;
let answers = {};
let score = 0;

async function loadQuiz(){
  const response = await fetch("renaissance-upto-shakespeare.json");
  quiz = await response.json();
  document.getElementById("title").textContent = quiz.test_title;
  render();
}

function render(){
  const q = quiz.questions[current];
  document.getElementById("progress").textContent =
    `Question ${current+1} of ${quiz.questions.length}`;
  document.getElementById("question").textContent = q.question;

  const options = document.getElementById("options");
  options.innerHTML = "";

  Object.entries(q.options).forEach(([key,value])=>{
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = `${key}. ${value}`;
    btn.onclick = () => selectAnswer(key);
    options.appendChild(btn);
  });

  document.getElementById("result").innerHTML = "";
  document.getElementById("score").textContent = `Score: ${score}`;

  document.getElementById("prev").disabled = current === 0;
  document.getElementById("next").disabled = current === quiz.questions.length - 1;

  if(answers[current]) showAnswer(answers[current]);
}

function selectAnswer(key){
  if(answers[current]) return;
  answers[current] = key;
  const q = quiz.questions[current];
  if(key === q.correct_answer) score++;
  showAnswer(key);
  document.getElementById("score").textContent = `Score: ${score}`;
}

function showAnswer(selected){
  const q = quiz.questions[current];
  document.querySelectorAll(".option").forEach(btn=>{
    const key = btn.textContent.substring(0,1);
    btn.disabled = true;
    if(key === q.correct_answer) btn.classList.add("correct");
    if(key === selected && key !== q.correct_answer) btn.classList.add("wrong");
  });

  const ok = selected === q.correct_answer;
  document.getElementById("result").innerHTML =
    `<strong>${ok ? "Correct!" : "Incorrect."}</strong>
     <div>Correct answer: <strong>${q.correct_answer}</strong></div>
     <div class="explanation"><strong>Explanation:</strong> ${q.explanation}</div>`;
}

document.getElementById("prev").onclick = ()=>{
  if(current>0){ current--; render(); }
};
document.getElementById("next").onclick = ()=>{
  if(current<quiz.questions.length-1){ current++; render(); }
};

loadQuiz().catch(err=>{
  document.getElementById("title").textContent = "Could not load quiz";
  document.getElementById("question").textContent =
    "Make sure index.html and renaissance-upto-shakespeare.json are in the same GitHub folder.";
});
</script>
</body>
</html>
